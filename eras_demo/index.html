<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eras Tour Gallery</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #0d0d0d;
      color: #fff;
      font-family: sans-serif;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      letter-spacing: 0.1em;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }
    .gallery figure {
      margin: 0;
      text-align: center;
    }
    .gallery img {
      max-width: 400px;
      max-height: 500px;
      width: 100%;
      border-radius: 8px;
      display: block;
    }
    .gallery figcaption {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Eras Tour Gallery</h1>
  <div class="gallery">
    <figure>
      <img src="taylor-swift-eras-tour.jpg" alt="Taylor Swift Eras Tour">
      <figcaption>taylor-swift-eras-tour.jpg</figcaption>
    </figure>
    <figure>
      <img src="taylor-swift-eras-tour.png" alt="Taylor Swift Eras Tour">
      <figcaption>taylor-swift-eras-tour.png</figcaption>
    </figure>
    <figure>
      <img src="taylor-swift-eras-tour altered.jpeg" alt="Taylor Swift Eras Tour (Altered)">
      <figcaption>taylor-swift-eras-tour altered.jpeg</figcaption>
    </figure>
    <figure>
      <img src="extra-image.jpeg" alt="Extra Image">
      <figcaption>extra-image.jpeg</figcaption>
    </figure>
  </div>
</body>
</html>
